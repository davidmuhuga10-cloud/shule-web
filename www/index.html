<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShuleTop</title>
<style>
  html,body{height:100%;margin:0;background:#0f3d3e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px}
  .logo{width:84px;height:84px;border-radius:20px;background:linear-gradient(135deg,#f0a833,#e8890b);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .name{font-size:20px;font-weight:700;letter-spacing:.3px}
  .sub{font-size:13px;opacity:.7}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🎓</div>
    <div class="name">ShuleTop</div>
    <div class="sub">Loading…</div>
  </div>
</body>
</html>
