<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shule — Super Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="admin-toasts"></div>
  <div id="admin-root">
    <div class="a-loader"><div class="a-spin"></div></div>
  </div>
  <script src="src/lib/config.js"></script>
  <script type="module" src="admin.js"></script>
  <script>
    // Same shared sw.js as the main app (see its header comment) — harmless
    // and consistent to register here too, since someone could open /admin
    // on a browser that's never loaded the main app.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
