## Netlify configuration for Shule.
## This is a static, no-build-step SPA (plain HTML/CSS/JS ES modules) plus one
## serverless function (netlify/functions/admin-provision.js). There is
## nothing to compile, so "command" is intentionally empty — Netlify just
## picks up the files as they are.

[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[functions]
  # Ships each function with its dependencies bundled — no separate
  # node_modules upload step needed for the function itself.
  node_bundler = "esbuild"

## --- Super Admin mini-app -------------------------------------------------
## admin.html/admin.js/admin.css are a SEPARATE static mini-app (Admin_
## Dashboard_Architecture3.docx: not bolted onto the main SPA's hash router),
## reached at /admin. Must come BEFORE the catch-all "/*" redirect below —
## Netlify applies redirects in order, first match wins — or every request
## for /admin would be served index.html instead.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

## --- Client-side routing -----------------------------------------------
## The app uses hash-based routing (index.html#/students, #/exams, ...), so
## every real "page" is still just index.html — the browser never asks the
## server for /students. This redirect exists only as a safety net for the
## rare case of someone hitting a stray non-hash path directly (an old
## bookmark, a typo, etc.) so they land on the app instead of a Netlify 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

## --- Headers -------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Security audit (penetration-test pass): this app has zero external
    # CDN/font dependencies (everything is self-hosted/vendored — see
    # src/vendor/) and, as of this same pass, zero inline <script> blocks
    # and zero inline onclick=/onchange=/... HTML attributes anywhere in
    # index.html/admin.html/every src/views/*.mjs file (every one of those
    # was rewired to a normal .onclick = fn binding instead). That means
    # script-src can be 'self' with NO 'unsafe-inline' — an actually
    # meaningful defense: even if an XSS injection point were ever found
    # despite the app's existing esc()-everywhere discipline, this blocks
    # the injected payload from executing as a <script> tag or an inline
    # event-handler attribute.
    #
    # style-src needs 'unsafe-inline': the app uses inline style="..."
    # attributes pervasively (hundreds of call sites) — removing all of
    # them is a much larger refactor than this pass, and inline CSS alone
    # can't execute script in a modern browser, so this is a deliberate,
    # low-risk trade-off, not an oversight.
    #
    # connect-src allows 'self' (this app's own Netlify functions) plus
    # this project's own Supabase URL (src/lib/config.js) — every
    # Supabase read/write goes there directly from the browser. img-src
    # allows data: because the school-logo feature stores logos as base64
    # data URLs (src/views/schoolSettings.mjs), not uploaded files.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://tyycjuppsdqcbrzmlimf.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    # Netlify may already add HSTS at the edge for its own domains — this
    # makes it explicit regardless of platform/custom-domain setup. Every
    # request here is already HTTPS-only (Netlify), so this has no
    # functional downside.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Costs nothing and shrinks the attack surface available to any
    # future script that does run — this app uses none of these browser
    # features anywhere.
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"

[[headers]]
  # The vendored supabase-js bundle is content-addressed only by this fixed
  # path, not by a hashed filename, so don't cache it forever — but it also
  # never changes on its own (only via a deliberate `npm run build:vendor`
  # re-run), so a short revalidation window is enough to avoid stale bundles
  # after an upgrade without re-fetching it on every visit.
  for = "/src/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  # sw.js's OWN bytes are what tells the browser "there's a new service
  # worker" (a byte-for-byte diff on its next fetch) — see sw.js's own
  # header comment for how the caching it does stays safe on its own, but
  # this file itself must never be cached by the browser/CDN, or that
  # update-check can be delayed far longer than it should be.
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
