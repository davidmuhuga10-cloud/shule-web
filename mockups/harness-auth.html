<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shule — auth-screen mockup harness</title>
<link rel="stylesheet" href="/src/styles/main.css">
<style>.mock-badge{position:fixed;top:8px;right:8px;background:#f5a623;color:#1b2733;font-weight:700;font-size:11px;padding:4px 9px;border-radius:6px;z-index:9999;font-family:sans-serif}</style>
</head>
<body>
  <div class="mock-badge">MOCK</div>
  <div id="toasts"></div>
  <div id="modal-root"></div>

  <div id="auth-screen" class="hidden"></div>
  <div id="app" class="hidden">
    <div class="shell">
      <aside class="sidebar" id="sidebar"><nav class="nav" id="nav"></nav></aside>
      <div class="main"><div class="topbar"><div class="ctx" id="topctx"></div></div><div class="content"><div id="view"></div></div></div>
    </div>
  </div>

  <script>
    // Real app.js's supabaseClient.js reads window.SHULE_CONFIG at import
    // time — a syntactically valid but unreachable project so getSession()
    // (called once on load) resolves locally with `session: null` and never
    // actually reaches the network, letting the REAL, unmodified renderAuth()
    // render exactly as production would for a signed-out visitor.
    window.SHULE_CONFIG = { SUPABASE_URL: 'https://mock-project.supabase.co', SUPABASE_ANON_KEY: 'mock-anon-key' };
    window.__mockMounted = false;
  </script>
  <script src="/src/lib/studentEmail.shared.js"></script>
  <script type="module" src="/src/app.js"></script>
  <script type="module">
    // The real app.js has no explicit "mounted" signal (it's the actual
    // production entry point, not a harness-aware shim) — poll for the
    // auth screen actually having content instead.
    const check = () => {
      const el = document.getElementById('auth-screen');
      if (el && !el.classList.contains('hidden') && el.children.length) window.__mockMounted = true;
      else setTimeout(check, 50);
    };
    check();
  </script>
</body>
</html>
