<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shule — School Management System</title>
<link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <div id="toasts"></div>
  <div id="modal-root"></div>
  <div id="scrim" class="scrim" onclick="window.App && App.toggleSidebar(false)"></div>

  <div id="auth-screen" class="hidden"></div>

  <div id="app" class="hidden">
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="logo">🎓</div>
          <div>
            <h1 id="brand-school">Shule</h1>
            <small>School Manager</small>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="side-foot">Shule &copy; <span id="year"></span></div>
      </aside>

      <div class="main">
        <div class="topbar">
          <button class="icon-btn menu-toggle" onclick="App.toggleSidebar()">☰</button>
          <div class="ctx" id="topctx"></div>
          <div class="spacer"></div>
          <div class="usermenu" id="usermenu-wrap">
            <div class="avatar" id="avatar" onclick="App.toggleUserMenu()"></div>
            <div class="dropdown hidden" id="usermenu">
              <div class="u-name">
                <div id="um-name" style="font-weight:650"></div>
                <div id="um-role" class="muted" style="font-size:12px"></div>
              </div>
              <a onclick="App.openChangePassword()">🔑 Change password</a>
              <a onclick="App.logout()">↩️ Sign out</a>
            </div>
          </div>
        </div>
        <div class="content">
          <div id="view"></div>
        </div>
      </div>
    </div>
  </div>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="src/lib/config.js"></script>
  <script src="src/lib/studentEmail.shared.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
