<body>
  <!-- POST-BUILD AUDIT (Sidebar_Performance_Login_Audit_Fixes.docx item 5,
       BUG, raised a second time): a static marketing/"blog" landing block
       used to live here, shown to a fresh visitor for the instant before an
       inline script removed it again, on the theory that it existed only
       for crawlers/link-previews and would never be visible to a real user.
       In practice it was still visibly showing up before login often enough
       to get reported twice — so rather than keep chasing the timing of
       "hide it fast enough," it's gone outright: visiting the site now goes
       straight to the sign-in screen with nothing else in between. The
       <head> meta/Open Graph/structured-data tags above are unaffected —
       those are invisible page metadata, not this rendered content, so
       search engines and link previews still get a real title/description
       for the page. -->

  <div id="toasts"></div>
  <div id="modal-root"></div>
  <div id="scrim" class="scrim"></div>

  <!-- Graceful offline state (mobile app + browser): a plain lost-connection
       error page looks broken and unbranded. This banner appears the moment
       the device loses connectivity and disappears the moment it's back, so
       the app degrades visibly and recoverably instead of just stalling. -->
  <div id="offline-banner" hidden style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#0f3d3e;color:#fff;padding:10px 16px;font:600 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center">
    <span>📡 You're offline — reconnect to keep using ShuleTop.</span>
    <button id="offline-retry" style="background:#e8890b;color:#fff;border:none;border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer">Retry</button>
  </div>

  <div id="auth-screen" class="hidden"></div>

  <div id="app" class="hidden">
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="logo">🎓</div>
          <div>
            <h1 id="brand-school">ShuleTop</h1>
            <small>School Manager</small>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="side-foot">ShuleTop &copy; <span id="year"></span></div>
      </aside>

      <div class="main">
        <div class="topbar">
          <button class="icon-btn menu-toggle" id="menu-toggle-btn">☰</button>
          <div class="ctx" id="topctx"></div>
          <div class="spacer"></div>
          <div class="usermenu" id="usermenu-wrap">
            <div class="avatar" id="avatar"></div>
            <div class="dropdown hidden" id="usermenu">
              <div class="u-name">
                <div id="um-name" style="font-weight:650"></div>
                <div id="um-role" class="muted" style="font-size:12px"></div>
              </div>
              <a id="um-change-password">🔑 Change password</a>
              <a id="um-privacy" href="/privacy.html" target="_blank" rel="noopener">🔒 Privacy Policy</a>
              <a id="um-delete-account" href="/account-deletion.html" target="_blank" rel="noopener">🗑️ Delete Account / Data</a>
              <a id="um-logout">↩️ Sign out</a>
            </div>
          </div>
        </div>
        <div class="content">
          <div id="view"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var banner = document.getElementById('offline-banner');
      var retryBtn = document.getElementById('offline-retry');
      var pollTimer = null;

      function show() { if (banner) banner.hidden = false; startPolling(); }
      function hide() { if (banner) banner.hidden = true; stopPolling(); }

      // BUG FIX (live report on the Play Store/Capacitor build): this
      // banner got permanently stuck reading "You're offline" even once
      // the device was fully connected and every other part of the app
      // was working fine — including right after tapping Retry, which
      // just reloaded the page into the exact same stuck state.
      // Root cause: navigator.onLine and the browser's 'online'/'offline'
      // events (which the original version trusted directly) are well
      // documented to be unreliable inside Android's WebView — the thing
      // that actually renders this app once Capacitor wraps it for the
      // Play Store — and can get stuck reporting the wrong value
      // indefinitely on some devices/Android versions. Trusting them WAS
      // the bug. Now neither is trusted directly — they're only used as a
      // hint to check sooner. Whether the banner is actually shown or
      // hidden is always decided by a real, tiny network request (this
      // site's own robots.txt, cache-busted so a cached response can't
      // lie about it): while the banner is showing, that check re-runs
      // every few seconds and hides it the instant a request actually
      // succeeds, no matter what navigator.onLine claims.
      function verifyConnectivity() {
        if (typeof fetch !== 'function') return;
        fetch('/robots.txt?_=' + Date.now(), { cache: 'no-store' })
          .then(function (res) { if (res && res.ok) hide(); else show(); })
          .catch(function () { show(); });
      }
      function startPolling() {
        if (pollTimer) return;
        pollTimer = setInterval(verifyConnectivity, 5000);
      }
      function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      }

      window.addEventListener('offline', verifyConnectivity);
      window.addEventListener('online', verifyConnectivity);
      if (retryBtn) retryBtn.onclick = verifyConnectivity;
      // Real verification on load too — not a navigator.onLine check —
      // since a stuck-false reading there was exactly what caused the
      // original bug to reappear on every reload.
      verifyConnectivity();
    })();
  </script>

  <script src="src/lib/config.js"></script>
  <script src="src/lib/studentEmail.shared.js"></script>
  <script src="src/lib/phone.shared.js"></script>
  <script type="module" src="src/app.js"></script>

  <!-- Native Android app shell (ShuleTop wrapped via Capacitor for the Play
       Store). This site is loaded as-is inside the native WebView, so this
       block is the only native-specific code and it does nothing when the
       page is opened in a normal browser: window.Capacitor only exists
       inside the wrapped app. Handles the hardware/gesture back button
       (walk the in-app hash history instead of closing the app outright)
       and paints the status bar to match the brand's dark teal sidebar. -->
  <script>
    (function () {
      if (!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
      var Plugins = window.Capacitor.Plugins || {};
      if (Plugins.StatusBar) {
        try {
          Plugins.StatusBar.setBackgroundColor({ color: '#0f3d3e' });
          Plugins.StatusBar.setStyle({ style: 'LIGHT' }); // light icons for a dark status bar
        } catch (e) { /* best-effort */ }
      }
      if (Plugins.App) {
        Plugins.App.addListener('backButton', function () {
          var atRoot = !location.hash || location.hash === '#/' || location.hash === '#' ||
            location.hash.replace(/^#\/?/, '').split('/')[0] === '' ||
            document.getElementById('auth-screen') && !document.getElementById('auth-screen').classList.contains('hidden');
          if (!atRoot && history.length > 1) {
            history.back();
          } else {
            Plugins.App.exitApp();
          }
        });
      }
    })();
  </script>
</body>
