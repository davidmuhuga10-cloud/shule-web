<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShuleTop — School Management System for Kenyan Schools</title>
<meta name="description" content="ShuleTop is a school management system built for Kenyan schools — manage students, exams, fees, timetables and staff, and send exam results and fee reminders to parents by SMS, all from one secure, easy-to-use dashboard.">
<meta name="keywords" content="school management system Kenya, school fees management software, SMS exam results system, school SMS software, school management system, Kenyan schools software, student information system Kenya">
<link rel="canonical" href="https://shuletop.com/">

<!-- Perf fix (Kodi comparison investigation): warms up the connection to
     Supabase before the app's own JS would otherwise discover it needs it —
     shaves a DNS+TLS round trip off the very first request, which matters
     most on the higher-latency mobile connections this app is built for. -->
<link rel="preconnect" href="https://tyycjuppsdqcbrzmlimf.supabase.co">
<link rel="dns-prefetch" href="https://tyycjuppsdqcbrzmlimf.supabase.co">

<!-- Open Graph / social sharing -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ShuleTop">
<meta property="og:title" content="ShuleTop — School Management System for Kenyan Schools">
<meta property="og:description" content="Manage students, exams, fees, timetables and staff — and send exam results and fee reminders to parents by SMS — all from one secure dashboard built for Kenyan schools.">
<meta property="og:url" content="https://shuletop.com/">
<meta property="og:locale" content="en_KE">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="ShuleTop — School Management System for Kenyan Schools">
<meta name="twitter:description" content="Manage students, exams, fees, timetables and staff — and send exam results and fee reminders to parents by SMS — all from one secure dashboard built for Kenyan schools.">

<!-- Structured data so Google understands this is a real software product -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "ShuleTop",
  "applicationCategory": "BusinessApplication",
  "operatingSystem": "Web",
  "url": "https://shuletop.com/",
  "description": "ShuleTop is a school management system for Kenyan schools covering student records, exams and report forms, fee collection, timetables, staff management, and SMS communication with parents.",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "KES",
    "availability": "https://schema.org/InStock"
  },
  "areaServed": {
    "@type": "Country",
    "name": "Kenya"
  }
}
</script>

<link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <!-- POST-BUILD AUDIT (Sidebar_Performance_Login_Audit_Fixes.docx item 5,
       BUG, raised a second time): a static marketing/"blog" landing block
       used to live here, shown to a fresh visitor for the instant before an
       inline script removed it again, on the theory that it existed only
       for crawlers/link-previews and would never be visible to a real user.
       In practice it was still visibly showing up before login often enough
       to get reported twice — so rather than keep chasing the timing of
       "hide it fast enough," it's gone outright: visiting the site now goes
       straight to the sign-in screen with nothing else in between. The
       <head> meta/Open Graph/structured-data tags above are unaffected —
       those are invisible page metadata, not this rendered content, so
       search engines and link previews still get a real title/description
       for the page. -->

  <div id="toasts"></div>
  <div id="modal-root"></div>
  <div id="scrim" class="scrim"></div>

  <!-- Graceful offline state (mobile app + browser): a plain lost-connection
       error page looks broken and unbranded. This banner appears the moment
       the device loses connectivity and disappears the moment it's back, so
       the app degrades visibly and recoverably instead of just stalling. -->
  <div id="offline-banner" hidden style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#0f3d3e;color:#fff;padding:10px 16px;font:600 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center">
    <span>📡 You're offline — reconnect to keep using ShuleTop.</span>
    <button id="offline-retry" style="background:#e8890b;color:#fff;border:none;border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer">Retry</button>
  </div>

  <div id="auth-screen" class="hidden"></div>

  <div id="app" class="hidden">
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="logo">🎓</div>
          <div>
            <h1 id="brand-school">ShuleTop</h1>
            <small>School Manager</small>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="side-foot">ShuleTop &copy; <span id="year"></span></div>
      </aside>

      <div class="main">
        <div class="topbar">
          <button class="icon-btn menu-toggle" id="menu-toggle-btn">☰</button>
          <div class="ctx" id="topctx"></div>
          <div class="spacer"></div>
          <div class="usermenu" id="usermenu-wrap">
            <div class="avatar" id="avatar"></div>
            <div class="dropdown hidden" id="usermenu">
              <div class="u-name">
                <div id="um-name" style="font-weight:650"></div>
                <div id="um-role" class="muted" style="font-size:12px"></div>
              </div>
              <a id="um-change-password">🔑 Change password</a>
              <a id="um-privacy" href="/privacy.html" target="_blank" rel="noopener">🔒 Privacy Policy</a>
              <a id="um-delete-account" href="/account-deletion.html" target="_blank" rel="noopener">🗑️ Delete Account / Data</a>
              <a id="um-logout">↩️ Sign out</a>
            </div>
          </div>
        </div>
        <div class="content">
          <div id="view"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- BUG FIX (v53): this used to be an inline <script> block here. This
       site's CSP is deliberately "script-src 'self'" with NO
       'unsafe-inline' (see netlify.toml) — an inline block silently never
       executes under it (a console error, nothing visible in the UI), so
       every previous fix to this banner's logic was dead code on every
       real device. Moved to an external file, which 'self' already
       permits with no change to the CSP. -->
  <script src="src/lib/offlineBanner.js"></script>

  <script src="src/lib/config.js"></script>
  <script src="src/lib/studentEmail.shared.js"></script>
  <script src="src/lib/phone.shared.js"></script>
  <script type="module" src="src/app.js"></script>

  <!-- Native Android app shell (ShuleTop wrapped via Capacitor for the Play
       Store). Moved to an external file (BUG FIX v53, same CSP reason as
       offlineBanner.js above) — this was an inline <script> block that the
       site's own CSP silently blocked from ever executing. -->
  <script src="src/lib/nativeShell.js"></script>
</body>
</html>
